<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Martin's Super Webapp</title>
<meta name="theme-color" content="#0d1117">
<meta name="description" content="Martin's personal mobile-first progressive web app, self-built with AI.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --text-muted: #8b949e;
  --accent: #58a6ff;
  --accent-hover: #79c0ff;
  --danger: #f85149;
  --success: #3fb950;
  --code-bg: #1c2128;
  --nav-h: 56px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
/* Viewport units (vh/dvh) are misreported by some standalone webviews
   (installed PWA), pushing the bottom nav off-screen. Percent heights
   resolve against the real initial containing block in every context:
   browser tab, installed app, keyboard open/closed. */
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100%;
  overflow: hidden;
}
.app {
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* ── Tab content area ─────────────────────────────────────── */
#tab-content {
  flex: 1;
  min-height: 0;
  position: relative;
}
.tab-pane {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
}
.tab-pane.active { display: flex; }
.tab-pane iframe { flex: 1; width: 100%; border: none; min-height: 0; display: block; }

/* ── Bottom nav ───────────────────────────────────────────── */
.bottom-nav {
  height: var(--nav-h);
  /* Keep the nav visible above the iOS home indicator / Android gesture bar. */
  padding-bottom: var(--safe-b);
  box-sizing: content-box;
  flex-shrink: 0;
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--border);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.bottom-nav::-webkit-scrollbar { display: none; }
.nav-btn {
  flex: 1;
  min-width: 60px;
  max-width: 120px;
  background: none;
  border: none;
  border-top: 2px solid transparent;
  color: var(--text-muted);
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  padding: 4px 6px 2px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  transition: color 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.nav-btn.active { color: var(--accent); border-top-color: var(--accent); }
.nav-btn:hover { color: var(--text); }
.nav-btn .nav-icon { font-size: 18px; line-height: 1.2; }
.nav-btn .nav-label { font-size: 10px; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }

/* ── Build pane ───────────────────────────────────────────── */
.panel-header {
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  cursor: pointer;
  user-select: none;
}
.panel-header .badge {
  font-size: 10px;
  background: var(--accent);
  color: #000;
  padding: 1px 6px;
  border-radius: 8px;
  font-weight: 700;
}
#messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.msg {
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.5;
  max-width: 90%;
  white-space: pre-wrap;
  word-break: break-word;
  flex-shrink: 0;
}
.msg.user { background: #1f6feb33; align-self: flex-end; border: 1px solid #1f6feb44; }
.msg.assistant { background: var(--code-bg); align-self: flex-start; border: 1px solid var(--border); }
.msg.tool {
  background: #3fb95022;
  align-self: flex-start;
  border: 1px solid #3fb95033;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  width: 100%;
  max-width: 100%;
}
.msg.exec {
  background: var(--code-bg);
  border: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  max-height: 140px;
  overflow-y: auto;
  align-self: flex-start;
  width: 100%;
  max-width: 100%;
}
.msg.system { background: #30363d33; align-self: center; border: 1px solid var(--border); font-size: 12px; color: var(--text-muted); max-width: 100%; }
.msg.error { background: #f8514922; align-self: flex-start; border: 1px solid #f8514933; }
.input-area {
  padding: 8px 12px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}
.input-area textarea {
  flex: 1;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 8px;
  font-size: 13px;
  font-family: inherit;
  resize: none;
  min-height: 44px;
  max-height: 120px;
}
.input-area textarea:focus { outline: none; border-color: var(--accent); }
.input-area button {
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 6px;
  padding: 8px 16px;
  font-weight: 600;
  cursor: pointer;
  font-size: 13px;
  white-space: nowrap;
  min-height: 44px;
}
.input-area button:hover { background: var(--accent-hover); }
.input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
.input-area button.stop { background: var(--danger); }
.input-area button.stop:hover { background: #da3633; }
#status {
  padding: 4px 12px;
  font-size: 11px;
  color: var(--text-muted);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

/* ── Settings bar ─────────────────────────────────────────── */
#settings-bar {
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: center;
  flex-shrink: 0;
  flex-wrap: wrap;
  overflow-y: auto;
  max-height: 40vh;
}
#settings-bar label { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
#settings-bar input, #settings-bar select {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  padding: 3px 6px;
  font-size: 11px;
  font-family: monospace;
}
#settings-bar input:focus, #settings-bar select:focus { outline: none; border-color: var(--accent); }
#settings-bar input[type="password"] { width: 180px; }
#settings-bar select { width: 140px; }
.btn-small {
  background: var(--code-bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  min-height: 28px;
}
.btn-small:hover { border-color: var(--accent); color: var(--accent); }
.btn-small.danger:hover { border-color: var(--danger); color: var(--danger); }

/* ── History bottom sheet ─────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: flex-end;
  z-index: 100;
}
.modal-overlay.open { display: flex; }
.modal-sheet {
  width: 100%;
  max-height: 75vh;
  background: var(--surface);
  border-radius: 14px 14px 0 0;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}
.modal-header {
  padding: 12px 16px;
  font-weight: 600;
  font-size: 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.modal-body { overflow-y: auto; flex: 1; padding: 10px; }
.history-item {
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.history-item .h-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); }
.history-item .h-tabs { font-size: 12px; color: var(--text); }
.history-item .h-prompt { font-size: 12px; color: var(--text-muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.history-item .h-hash { font: 10px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-muted); }
.history-empty { padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px; }

/* ── Tab sharing ───────────────────────────────────────────── */
.share-form { display: flex; flex-direction: column; gap: 12px; }
.share-form label { display: flex; flex-direction: column; gap: 5px; color: var(--text-muted); font-size: 12px; }
.share-form input, .share-form select {
  width: 100%; background: var(--code-bg); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); padding: 9px; font: inherit; font-size: 13px;
}
.share-form input:focus, .share-form select:focus { outline: none; border-color: var(--accent); }
.share-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.share-actions .btn-small { min-height: 36px; font-size: 12px; }
.share-note { color: var(--text-muted); font-size: 12px; line-height: 1.45; }
.share-result { display: none; gap: 6px; }
.share-result.visible { display: flex; }

/* ── Scrollbar ────────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ── Loading animation ────────────────────────────────────── */
.loading::after { content: ''; animation: dots 1.5s steps(4, end) infinite; }
@keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }
</style>
</head>
<body>
<div class="app">
  <div id="tab-content">

    <!-- Build pane (always present) -->
    <div class="tab-pane active" id="pane-build">
      <div class="panel-header" id="panel-header">
        <span>🔧 Build</span>
        <span class="badge" id="model-badge">agent</span>
        <div style="display:flex;gap:6px;margin-left:auto" onclick="event.stopPropagation()">
          <button class="btn-small" id="share-btn">Share</button>
          <button class="btn-small" id="history-btn">History</button>
          <button class="btn-small" id="clear-chat-btn">Clear</button>
        </div>
      </div>
      <div id="settings-bar" style="display:none">
        <label>Config <select id="config-select" style="width:150px"></select></label>
        <button class="btn-small" id="save-config-btn">Save</button>
        <button class="btn-small danger" id="delete-config-btn">Delete</button>
        <label>Name <input type="text" id="config-name-input" placeholder="my-config" style="width:90px"></label>
        <label>API Key <input type="password" id="api-key-input" placeholder="sk-..."></label>
        <label>Model <input type="text" id="model-select" value="gpt-4o" style="width:130px"></label>
        <label>API URL <select id="api-url-input" style="width:190px"></select></label>
      </div>
      <div id="messages"></div>
      <div id="status" hidden></div>

        <textarea id="chat-input" placeholder="Ask the AI to build a new tab…" rows="2"></textarea>
        <button id="send-btn">Send</button>
      </div>
    </div>
    <!-- Dynamic tab panes are injected here by JS -->

  </div>

  <nav class="bottom-nav" id="bottom-nav">
    <!-- Dynamic tab buttons inserted before Build -->
    <button class="nav-btn active" data-tab="build" id="nav-btn-build">
      <span class="nav-icon">🔧</span>
      <span class="nav-label">Build</span>
    </button>
  </nav>
</div>

<!-- History bottom sheet -->
<div class="modal-overlay" id="history-modal" onclick="closeHistoryModal()">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span>Version History</span>
      <button class="btn-small" onclick="closeHistoryModal()">✕</button>
    </div>
    <div class="modal-body" id="history-list"></div>
  </div>
</div>

<!-- Share bottom sheet -->
<div class="modal-overlay" id="share-modal" onclick="closeShareModal()">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span>Share a tab</span>
      <button class="btn-small" onclick="closeShareModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="share-form">
        <label>Tab <select id="share-tab-select"></select></label>
        <div class="share-actions">
          <button class="btn-small" id="publish-gist-btn">Publish public GitHub Gist</button>
        </div>
        <label>GitHub token (only needed to publish)
          <input id="github-token-input" type="password" autocomplete="off" placeholder="Fine-grained token with Gists: read/write">
        </label>
        <p class="share-note">The token is used only for this request and is never saved. Publishing creates a public Gist and automatically generates the share link from its raw URL.</p>
        <div class="share-actions"><button class="btn-small" id="native-share-btn" hidden>Share</button></div>
        <div class="share-result" id="share-result">
          <label>Share link <input id="share-link-output" type="text" readonly></label>
          <button class="btn-small" id="copy-share-link-btn">Copy link</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
// 1. STORAGE — tabs + version history
// ============================================================
const TABS_KEY        = 'msw_tabs';
const HISTORY_KEY     = 'msw_history';
const API_KEY_KEY     = 'agent_api_key';
const MSGS_KEY        = 'agent_messages';
const MODEL_KEY       = 'agent_model';
const API_URL_KEY     = 'agent_api_url';
const CONFIGS_KEY     = 'agent_configs';
const ACTIVE_CFG_KEY  = 'agent_active_config';
const MAX_HISTORY     = 50;
const SHARE_PARAM     = 'tab';
const TAB_DOCUMENT_VERSION = 1;

function getTabs() {
  try { return JSON.parse(localStorage.getItem(TABS_KEY)) || []; } catch { return []; }
}
function setTabs(tabs) {
  localStorage.setItem(TABS_KEY, JSON.stringify(tabs));
}
async function hashTabVersion(tab) {
  const bytes = new TextEncoder().encode(JSON.stringify(tab ?? null));
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, '0')).join('');
}

async function saveTabSnapshot(tab, prompt = activePrompt, previousTab = tab, currentTab = tab) {
  if (!tab) return;
  const [previousHash, currentHash] = await Promise.all([hashTabVersion(previousTab), hashTabVersion(currentTab)]);
  const history = getHistory();
  history.unshift({ timestamp: Date.now(), tab: JSON.parse(JSON.stringify(tab)), prompt, hashAlgorithm: 'SHA-256', previousHash, currentHash });
  if (history.length > MAX_HISTORY) history.length = MAX_HISTORY;
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}
function getHistory() {
  try {
    const history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    // History used to contain complete tab arrays. Expand those legacy entries so
    // previous versions remain available as individual tab revisions.
    return history.flatMap(entry => entry.tab ? [entry] : (entry.tabs || []).map(tab => ({ timestamp: entry.timestamp, tab })));
  } catch { return []; }
}

// ============================================================
// 2. SANDBOXED JS EXECUTION
// ============================================================
const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;

async function executeJS(code) {
  const outputs = [];
  const origConsole = {};
  ['log','info','warn','error','debug','dir','table'].forEach(m => {
    origConsole[m] = console[m];
    console[m] = (...args) => {
      outputs.push({ type: m === 'error' ? 'stderr' : 'stdout', text: args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ') });
      origConsole[m].apply(console, args);
    };
  });
  try {
    const fn = new AsyncFunction('"use strict";\n' + code);
    const result = await fn();
    const r = result === undefined ? 'undefined' : (() => { try { return JSON.stringify(result, null, 2); } catch { return String(result); } })();
    return { result: r, outputs, error: null };
  } catch (err) {
    return { result: null, outputs, error: err.stack || err.message };
  } finally {
    ['log','info','warn','error','debug','dir','table'].forEach(m => { console[m] = origConsole[m]; });
  }
}

// ============================================================
// 3. CHAT / LLM
// ============================================================
let messages = [];
let isProcessing = false;
let abortController = null;
let cancelRequested = false;
let lastActivity = Date.now();
let activePrompt = '';

function setStatus(text) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.hidden = !text;
  lastActivity = Date.now();
}
function lockInput() {
  isProcessing = true;
  cancelRequested = false;
  const btn = document.getElementById('send-btn');
  const input = document.getElementById('chat-input');
  // keep the button clickable so it can act as Stop
  btn.textContent = 'Stop';
  btn.classList.add('stop');
  input.disabled = true;
}
function unlockInput() {
  isProcessing = false;
  cancelRequested = false;
  abortController = null;
  const btn = document.getElementById('send-btn');
  const input = document.getElementById('chat-input');
  btn.disabled = false;
  input.disabled = false;
  btn.textContent = 'Send';
  btn.classList.remove('stop');
  setStatus('');
  input.focus();
}

// ── Config management ────────────────────────────────────────
function getConfigs() { try { return JSON.parse(localStorage.getItem(CONFIGS_KEY)) || {}; } catch { return {}; } }
function setConfigs(c) { localStorage.setItem(CONFIGS_KEY, JSON.stringify(c)); }
function getActiveCfgName() { return localStorage.getItem(ACTIVE_CFG_KEY) || ''; }
function setActiveCfgName(n) { localStorage.setItem(ACTIVE_CFG_KEY, n); }

function populateConfigSelect() {
  const sel = document.getElementById('config-select');
  const configs = getConfigs();
  const active = getActiveCfgName();
  sel.innerHTML = '';
  const manual = document.createElement('option');
  manual.value = ''; manual.textContent = '— Manual —';
  if (!active || !configs[active]) manual.selected = true;
  sel.appendChild(manual);
  Object.keys(configs).sort().forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    if (name === active) opt.selected = true;
    sel.appendChild(opt);
  });
}

function loadConfig(name) {
  const cfg = getConfigs()[name];
  if (!cfg) return false;
  document.getElementById('api-key-input').value = cfg.apiKey || '';
  document.getElementById('model-select').value = cfg.model || 'gpt-4o';
  const urlSel = document.getElementById('api-url-input');
  const url = cfg.apiUrl || INFERENCE_URLS[0];
  for (const opt of urlSel.options) { if (opt.value === url) { opt.selected = true; break; } }
  document.getElementById('model-badge').textContent = cfg.model || 'gpt-4o';
  localStorage.setItem(API_KEY_KEY, cfg.apiKey || '');
  localStorage.setItem(MODEL_KEY, cfg.model || 'gpt-4o');
  localStorage.setItem(API_URL_KEY, url);
  setActiveCfgName(name);
  return true;
}

function saveCurrentAsConfig(name) {
  if (!name?.trim()) return false;
  name = name.trim();
  const configs = getConfigs();
  configs[name] = {
    apiKey: document.getElementById('api-key-input').value,
    model:  document.getElementById('model-select').value,
    apiUrl: document.getElementById('api-url-input').value
  };
  setConfigs(configs);
  setActiveCfgName(name);
  populateConfigSelect();
  return true;
}

function deleteConfig(name) {
  if (!name) return false;
  const configs = getConfigs();
  if (!configs[name]) return false;
  delete configs[name];
  setConfigs(configs);
  if (getActiveCfgName() === name) setActiveCfgName('');
  populateConfigSelect();
  return true;
}

const INFERENCE_URLS = [
  "https://openrouter.ai/api/v1",
  "https://api.z.ai/api/coding/paas/v4",
  "https://assert-service.services.ai.azure.com/openai/deployments/deepseek-v4-flash?api-version=2024-12-01-preview",
  "https://assert-service.services.ai.azure.com/openai/deployments/kimi-k2.6?api-version=2024-12-01-preview",
  "https://integrate.api.nvidia.com/v1",
  "https://api.modelstream.ai/v1",
  "https://opencode.ai/zen/v1",
  "https://gpu1.eecs.kth.se/services/ollama-keys/v1"
];

function loadSettings() {
  const urlSel = document.getElementById('api-url-input');
  urlSel.innerHTML = '';
  INFERENCE_URLS.forEach(url => {
    const opt = document.createElement('option');
    opt.value = url; opt.textContent = url;
    urlSel.appendChild(opt);
  });
  const activeName = getActiveCfgName();
  const configs = getConfigs();
  if (activeName && configs[activeName]) {
    loadConfig(activeName);
  } else {
    document.getElementById('api-key-input').value = localStorage.getItem(API_KEY_KEY) || '';
    document.getElementById('model-select').value  = localStorage.getItem(MODEL_KEY)   || 'gpt-4o';
    const savedUrl = localStorage.getItem(API_URL_KEY) || INFERENCE_URLS[0];
    for (const opt of urlSel.options) { if (opt.value === savedUrl) { opt.selected = true; break; } }
    document.getElementById('model-badge').textContent = localStorage.getItem(MODEL_KEY) || 'gpt-4o';
  }
  populateConfigSelect();
}

function saveSettings() {
  localStorage.setItem(API_KEY_KEY, document.getElementById('api-key-input').value);
  localStorage.setItem(MODEL_KEY,   document.getElementById('model-select').value);
  localStorage.setItem(API_URL_KEY, document.getElementById('api-url-input').value);
  document.getElementById('model-badge').textContent = document.getElementById('model-select').value;
}

function loadMessages() {
  try { messages = JSON.parse(localStorage.getItem(MSGS_KEY)) || []; } catch { messages = []; }
  renderMessages();
}
function saveMessages() { localStorage.setItem(MSGS_KEY, JSON.stringify(messages)); }

// ── System prompt ────────────────────────────────────────────
const SYSTEM_PROMPT = `You are the AI builder for Martin's Super Webapp — a mobile-first PWA. Your role is to create and modify tabs using the tools provided. Each tab is a self-contained HTML page displayed in an iframe.

## Tab tools
- list_tabs() — see all existing tabs (id, label, size)
- get_tab(id) — read a tab's full HTML before editing it
- set_tab(id, label, html) — create or replace a tab. The saved version is paired with the user's latest prompt (user can roll back that tab via History). id: short kebab-case slug. label: ≤8 chars for the nav bar.
- delete_tab(id) — remove a tab permanently

## Library search
Before using any external library, call search_libraries("name") to get the exact CDN URL and version. Then add a <script src="..."> or <link rel="stylesheet" href="..."> in the tab's <head>. Never guess CDN URLs.

## Writing tab HTML
Every tab must be a complete HTML document:
\`\`\`html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tab Name</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  /* design tokens: surface #161b22 | border #30363d | muted #8b949e | accent #58a6ff */
</style>
</head>
<body>...</body>
</html>
\`\`\`

Mobile-first rules (the app is primarily used on a phone):
- Minimum tap target: 44px tall
- Minimum font size: 14px
- No horizontal scrolling — fluid layouts only
- Input fields at least 44px tall
- Use flexbox or grid; avoid fixed pixel widths

## Data persistence
Tabs share localStorage with the parent app (same origin). Namespace your keys: localStorage.setItem('msw_tab_TABID_key', value).

## execute_js
Use execute_js(code) to inspect app state, test logic, or read/write localStorage from the parent context.

## Process
1. Call list_tabs() to see what exists
2. To make a targeted edit to an existing tab, call update_tab(id, old_text, new_text). Use get_tab(id) first only when you need to inspect its full HTML; use set_tab for a complete replacement.
3. For any library, call search_libraries first
4. Call set_tab to create or update
5. Call finish when done`;

// ── Tool definitions ─────────────────────────────────────────
const _browserGlobals = Object.getOwnPropertyNames(window)
  .filter(k => { if (k.startsWith('on') || k.startsWith('webkit')) return false; try { const v = window[k]; return typeof v === 'function' || (typeof v === 'object' && v !== null); } catch { return false; } })
  .filter(k => /^[A-Z]/.test(k)).sort().join(', ');

const TOOLS = [
  { type: "function", function: {
    name: "list_tabs",
    description: "List all current tabs (id, label, html size in bytes).",
    parameters: { type: "object", properties: {} }
  }},
  { type: "function", function: {
    name: "get_tab",
    description: "Get the full HTML content of a tab by id. Call this before editing an existing tab.",
    parameters: { type: "object", properties: { id: { type: "string", description: "Tab id." } }, required: ["id"] }
  }},
  { type: "function", function: {
    name: "set_tab",
    description: "Create or replace a tab. Autosaves that tab's version with the latest user prompt. The tab renders as a full HTML page in an iframe.",
    parameters: {
      type: "object",
      properties: {
        id:    { type: "string", description: "Short kebab-case slug, e.g. 'todo', 'weather'." },
        label: { type: "string", description: "Display name in the bottom nav bar (keep ≤8 chars)." },
        html:  { type: "string", description: "Complete HTML document starting with <!DOCTYPE html>." }
      },
      required: ["id", "label", "html"]
    }
  }},
  { type: "function", function: {
    name: "update_tab",
    description: "Replace one exact text fragment in an existing tab's HTML. The old text must occur exactly once. Autosaves the updated tab with the latest user prompt.",
    parameters: {
      type: "object",
      properties: {
        tab_id: { type: "string", description: "Id of the tab to update." },
        old_text: { type: "string", description: "Exact existing text to replace; it must occur exactly once." },
        new_text: { type: "string", description: "Replacement text." }
      },
      required: ["tab_id", "old_text", "new_text"]
    }
  }},
  { type: "function", function: {
    name: "delete_tab",
    description: "Permanently remove a tab. Autosaves that tab's version before deleting.",
    parameters: { type: "object", properties: { id: { type: "string" } }, required: ["id"] }
  }},
  { type: "function", function: {
    name: "search_libraries",
    description: "Search cdnjs.com for JavaScript/CSS libraries by keyword. Returns name, description, version, and CDN URL. Always call this before using any external library.",
    parameters: { type: "object", properties: { query: { type: "string", description: "Search keywords, e.g. 'chart', 'markdown parser', 'date formatting'." } }, required: ["query"] }
  }},
  { type: "function", function: {
    name: "execute_js",
    description: `Execute JavaScript in the main app browser context (not inside a tab iframe). Useful for inspecting state, testing logic, or reading/writing localStorage. Top-level await supported. Available globals: ${_browserGlobals}.`,
    parameters: { type: "object", properties: { code: { type: "string" } }, required: ["code"] }
  }},
  { type: "function", function: {
    name: "finish",
    description: "Call when the user's request is fully complete.",
    parameters: { type: "object", properties: { message: { type: "string", description: "Brief summary of what was done." } }, required: ["message"] }
  }}
];

function buildAPIMessages() {
  return [
    { role: 'system', content: SYSTEM_PROMPT },
    ...messages.filter(m => m.role !== 'exec').map(m => {
      const msg = { role: m.role };
      if (m.tool_calls) { msg.content = null; msg.tool_calls = m.tool_calls; }
      else if (m.content) { msg.content = m.content; }
      if (m.tool_call_id) msg.tool_call_id = m.tool_call_id;
      return msg;
    })
  ];
}

async function callLLM() {
  const apiKey = document.getElementById('api-key-input').value;
  const model   = document.getElementById('model-select').value;
  const apiUrl  = document.getElementById('api-url-input').value;

  if (!apiKey) { addMessage('system', 'Set your API key in settings (tap the Build header).'); return null; }

  const qIdx = apiUrl.indexOf('?');
  const url = qIdx === -1 ? `${apiUrl}/chat/completions` : `${apiUrl.slice(0, qIdx)}/chat/completions${apiUrl.slice(qIdx)}`;
  abortController = new AbortController();
  const controller = abortController;
  let timedOut = false;
  const timeoutId = setTimeout(() => { timedOut = true; controller.abort(); }, 120000);
  const opts = {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
    body: JSON.stringify({ model, messages: buildAPIMessages(), tools: TOOLS, tool_choice: "auto", temperature: 0.2, max_tokens: 16384 }),
    mode: 'cors', credentials: 'omit',
    signal: controller.signal
  };

  let response;
  try { response = await fetch(url, opts); }
  catch (e) {
    clearTimeout(timeoutId);
    if (e.name === 'AbortError') {
      addMessage('error', timedOut ? 'Request timed out after 2 min.' : 'Cancelled.');
      return null;
    }
    // transient network glitch — one retry
    try { await new Promise(r => setTimeout(r, 500)); response = await fetch(url, opts); }
    catch (e2) {
      if (e2.name === 'AbortError') { addMessage('error', timedOut ? 'Request timed out after 2 min.' : 'Cancelled.'); return null; }
      addMessage('error', `Network error: ${e2.message}`); return null;
    }
  } finally { clearTimeout(timeoutId); }
  abortController = null;

  if (!response.ok) {
    const txt = await response.text().catch(() => '');
    addMessage('error', `API error ${response.status}: ${txt}`);
    return null;
  }
  try {
    const data = await response.json();
    const msg = data.choices?.[0]?.message;
    return { content: msg?.content || '', tool_calls: msg?.tool_calls || [], finish_reason: data.choices?.[0]?.finish_reason };
  } catch (e) { addMessage('error', `Parse error: ${e.message}`); return null; }
}

async function executeToolCall(tc) {
  const { tool, params } = tc;
  try {
    let result;
    switch (tool) {
      case 'finish': { result = { done: true, summary: params.message || 'Done.' }; break; }

      case 'list_tabs': {
        const tabs = getTabs();
        result = { tabs: tabs.map(t => ({ id: t.id, label: t.label, size: (t.html || '').length })) };
        break;
      }

      case 'get_tab': {
        const tab = getTabs().find(t => t.id === params.id);
        result = tab ? { id: tab.id, label: tab.label, html: tab.html } : { error: `Tab not found: ${params.id}` };
        break;
      }

      case 'set_tab': {
        const tabs = getTabs();
        const idx = tabs.findIndex(t => t.id === params.id);
        const previousTab = idx >= 0 ? tabs[idx] : null;
        if (idx >= 0) tabs[idx] = { id: params.id, label: params.label, html: params.html };
        else tabs.push({ id: params.id, label: params.label, html: params.html });
        const savedTab = tabs[idx >= 0 ? idx : tabs.length - 1];
        await saveTabSnapshot(savedTab, activePrompt, previousTab, savedTab);
        setTabs(tabs);
        renderNavTabs();
        const existingIframe = tabIframes[params.id];
        if (existingIframe) {
          existingIframe.removeAttribute('sandbox');
          existingIframe.srcdoc = params.html;
        }
        result = { success: true, id: params.id, label: params.label, action: idx >= 0 ? 'updated' : 'created' };
        break;
      }

      case 'update_tab': {
        const tabs = getTabs();
        const idx = tabs.findIndex(t => t.id === params.tab_id);
        if (idx < 0) { result = { error: `Tab not found: ${params.tab_id}` }; break; }
        if (!params.old_text) { result = { error: 'old_text must not be empty.' }; break; }
        const tab = tabs[idx];
        const firstMatch = tab.html.indexOf(params.old_text);
        if (firstMatch < 0) { result = { error: 'old_text was not found in the tab HTML.' }; break; }
        if (tab.html.indexOf(params.old_text, firstMatch + params.old_text.length) >= 0) {
          result = { error: 'old_text occurs more than once. Provide a longer, unique fragment.' };
          break;
        }
        const updatedTab = { ...tab, html: `${tab.html.slice(0, firstMatch)}${params.new_text}${tab.html.slice(firstMatch + params.old_text.length)}` };
        tabs[idx] = updatedTab;
        await saveTabSnapshot(updatedTab, activePrompt, tab, updatedTab);
        setTabs(tabs);
        renderNavTabs();
        const existingIframe = tabIframes[updatedTab.id];
        if (existingIframe) {
          if (updatedTab.shared) existingIframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-modals');
          else existingIframe.removeAttribute('sandbox');
          existingIframe.srcdoc = updatedTab.html;
        }
        result = { success: true, id: updatedTab.id, label: updatedTab.label, action: 'updated' };
        break;
      }

      case 'delete_tab': {
        const tabs = getTabs();
        const idx = tabs.findIndex(t => t.id === params.id);
        if (idx < 0) { result = { error: `Tab not found: ${params.id}` }; break; }
        await saveTabSnapshot(tabs[idx], activePrompt, tabs[idx], null);
        tabs.splice(idx, 1);
        setTabs(tabs);
        const pane = document.getElementById(`pane-${params.id}`);
        if (pane) pane.remove();
        delete tabIframes[params.id];
        renderNavTabs();
        if (activeTab === params.id) activateTab('build');
        result = { success: true, id: params.id };
        break;
      }

      case 'search_libraries': {
        const q = encodeURIComponent(params.query);
        const libCtl = AbortSignal.timeout(15000);
        const resp = await fetch(`https://api.cdnjs.com/libraries?search=${q}&fields=name,description,filename,version&limit=8`, { signal: libCtl });
        const data = await resp.json();
        result = (data.results || []).map(lib => ({
          name: lib.name,
          description: lib.description || '',
          version: lib.version,
          url: `https://cdnjs.cloudflare.com/ajax/libs/${lib.name}/${lib.version}/${lib.filename}`
        }));
        break;
      }

      case 'execute_js': {
        addExecMessage(`execute_js:\n${params.code}`, 'code');
        const execResult = await executeJS(params.code);
        let lines = (execResult.outputs || []).map(o => o.text).join('\n');
        if (execResult.error) {
          lines += (lines ? '\n' : '') + `Error: ${execResult.error}`;
          result = { error: execResult.error, outputs: execResult.outputs, _out: lines };
        } else {
          if (execResult.result !== 'undefined') lines += (lines ? '\n' : '') + `→ ${execResult.result}`;
          result = execResult.result === 'undefined'
            ? { outputs: execResult.outputs, _out: lines }
            : { result: execResult.result, outputs: execResult.outputs, _out: lines };
        }
        break;
      }

      default:
        result = { error: `Unknown tool: ${tool}` };
    }
    return result;
  } catch (err) {
    return { error: err.message };
  }
}

async function processUserMessage(userText) {
  if (isProcessing) return;
  lockInput();
  activePrompt = userText;

  try {
    addMessage('user', userText);
    messages.push({ role: 'user', content: userText });
    saveMessages();

    let iterations = 0;
    let malformedRetries = 0;
    while (iterations < 30 && !cancelRequested) {
      iterations++;
      setStatus(`Thinking${iterations > 1 ? ` (step ${iterations})` : ''}…`);
      const response = await callLLM();
      if (!response || cancelRequested) break;

      if (!response.tool_calls?.length) {
        if (response.content) { addMessage('assistant', response.content); messages.push({ role: 'assistant', content: response.content }); saveMessages(); }
        break;
      }
      if (response.finish_reason === 'length') {
        addMessage('error', 'Response hit the max_tokens limit — tool arguments may be truncated.');
      }

      const assistantMsg = { role: 'assistant', content: null, tool_calls: response.tool_calls };
      messages.push(assistantMsg);
      saveMessages();

      let parsed;
      try {
        parsed = response.tool_calls.map(tc => ({ tool: tc.function.name, params: JSON.parse(tc.function.arguments || '{}'), id: tc.id }));
      } catch (e) {
        addMessage('error', `Failed to parse tool call arguments: ${e.message}`);
        // Roll back the unparseable assistant turn and feed the error back to the model so it can retry.
        messages.pop();
        if (malformedRetries < 3) {
          malformedRetries++;
          messages.push({ role: 'user', content: `Your last tool call arguments were invalid JSON (${e.message}). The call was not executed. Re-issue the tool call with valid JSON. To avoid truncation on large tabs: keep tab HTML minimal and compact (no comments, no long attribute lists), or build the tab in pieces — first set_tab with a skeleton, then refine with get_tab + set_tab edits.` });
          saveMessages();
          continue;
        }
        addMessage('error', 'Giving up after 3 malformed tool calls.');
        break;
      }
      if (response.content?.trim()) addMessage('assistant', response.content.trim());

      let done = false;
      for (const tc of parsed) {
        if (cancelRequested) break;
        setStatus(`Running ${tc.tool}…`);
        if (tc.tool !== 'execute_js') addMessage('tool', `→ ${tc.tool}(${JSON.stringify(tc.params)})`);
        const result = await executeToolCall(tc);
        const out = result._out; delete result._out;
        const resultStr = JSON.stringify(result, null, 2);
        if (tc.tool === 'execute_js') { if (out) addExecMessage(out); }
        else addMessage('tool', `✓ ${tc.tool}: ${resultStr}`);
        messages.push({ role: 'tool', tool_call_id: tc.id, content: resultStr });
        saveMessages();
        if (tc.tool === 'finish') { done = true; addMessage('assistant', result.summary || 'Done.'); break; }
      }
      if (done) break;
    }
  } catch (err) {
    addMessage('error', `Unexpected error: ${err.message}`);
  } finally {
    activePrompt = '';
    unlockInput();
  }
}

let activeTab = 'build';
const tabIframes = {};

function renderNavTabs() {
  const nav = document.getElementById('bottom-nav');
  const buildBtn = document.getElementById('nav-btn-build');
  Array.from(nav.querySelectorAll('.nav-btn:not(#nav-btn-build)')).forEach(b => b.remove());
  const tabs = getTabs();
  tabs.forEach(tab => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (activeTab === tab.id ? ' active' : '');
    btn.dataset.tab = tab.id;
    btn.id = `nav-btn-${tab.id}`;
    const label = document.createElement('span');
    label.className = 'nav-label';
    label.textContent = tab.label;
    btn.appendChild(label);
    btn.onclick = () => activateTab(tab.id);
    nav.insertBefore(btn, buildBtn);
  });
  buildBtn.classList.toggle('active', activeTab === 'build');
  // Rebuild panes for tabs that lost their DOM node (fresh document after cold resume).
  tabs.forEach(tab => {
    if (document.getElementById(`pane-${tab.id}`)) return;
    const pane = document.createElement('div');
    pane.className = 'tab-pane';
    pane.id = `pane-${tab.id}`;
    const iframe = document.createElement('iframe');
    // Shared documents are arbitrary third-party HTML. Keep them isolated from
    // this app's localStorage (which can include API keys) and parent document.
    if (tab.shared) iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-modals');
    iframe.srcdoc = tab.html;
    pane.appendChild(iframe);
    document.getElementById('tab-content').appendChild(pane);
    tabIframes[tab.id] = iframe;
  });
}

function refreshTabsFromStorage() {
  const tabs = getTabs();
  const tabIds = new Set(tabs.map(tab => tab.id));
  Object.keys(tabIframes).forEach(id => {
    if (tabIds.has(id)) return;
    document.getElementById(`pane-${id}`)?.remove();
    delete tabIframes[id];
  });
  if (activeTab !== 'build' && !tabIds.has(activeTab)) activeTab = 'build';
  renderNavTabs();
  // Make sure the pane/iframe for the active tab exists after a cold resume.
  if (document.getElementById('pane-build')?.classList.contains('active')) return;
  activateTab(activeTab);
}

function activateTab(id) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

  if (id === 'build') {
    document.getElementById('pane-build').classList.add('active');
  } else {
    const tabs = getTabs();
    const tab = tabs.find(t => t.id === id);
    if (!tab) { activateTab('build'); return; }

    let pane = document.getElementById(`pane-${id}`);
    if (!pane) {
      pane = document.createElement('div');
      pane.className = 'tab-pane';
      pane.id = `pane-${id}`;
      const iframe = document.createElement('iframe');
      if (tab.shared) iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-modals');
      iframe.srcdoc = tab.html;
      pane.appendChild(iframe);
      document.getElementById('tab-content').appendChild(pane);
      tabIframes[id] = iframe;
    }
    pane.classList.add('active');
  }

  const btn = document.getElementById(`nav-btn-${id}`);
  if (btn) btn.classList.add('active');
  activeTab = id;
}

function base64UrlEncode(value) {
  const bytes = new TextEncoder().encode(value);
  let binary = '';
  bytes.forEach(byte => { binary += String.fromCharCode(byte); });
  return btoa(binary).replaceAll('+', '-').replaceAll('/', '_').replaceAll('=', '');
}

function base64UrlDecode(value) {
  const padded = value.replaceAll('-', '+').replaceAll('_', '/') + '='.repeat((4 - value.length % 4) % 4);
  const binary = atob(padded);
  return new TextDecoder().decode(Uint8Array.from(binary, char => char.charCodeAt(0)));
}

function makeTabDocument(tab) {
  return { version: TAB_DOCUMENT_VERSION, type: 'martin-superwebapp-tab', tab: { id: tab.id, label: tab.label, html: tab.html } };
}

function validSharedTab(document) {
  const tab = document?.tab;
  return document?.type === 'martin-superwebapp-tab' && document?.version === TAB_DOCUMENT_VERSION
    && tab && typeof tab.id === 'string' && typeof tab.label === 'string' && typeof tab.html === 'string';
}

function makeShareUrl(publicTabUrl) {
  const url = new URL(location.href);
  url.search = '';
  url.hash = '';
  url.searchParams.set(SHARE_PARAM, base64UrlEncode(publicTabUrl));
  return url.href;
}

function showShareLink(publicTabUrl) {
  const link = makeShareUrl(publicTabUrl);
  document.getElementById('share-link-output').value = link;
  document.getElementById('share-result').classList.add('visible');
  document.getElementById('native-share-btn').hidden = !navigator.share;
  return link;
}

function openShareModal() {
  const select = document.getElementById('share-tab-select');
  select.replaceChildren();
  const tabs = getTabs();
  tabs.forEach(tab => {
    const option = document.createElement('option');
    option.value = tab.id;
    option.textContent = `${tab.label} (${tab.id})`;
    option.selected = tab.id === activeTab;
    select.appendChild(option);
  });
  document.getElementById('publish-gist-btn').disabled = !tabs.length;
  document.getElementById('share-modal').classList.add('open');
}

function closeShareModal() { document.getElementById('share-modal').classList.remove('open'); }

async function publishSelectedTabToGist() {
  const tab = getTabs().find(item => item.id === document.getElementById('share-tab-select').value);
  const token = document.getElementById('github-token-input').value.trim();
  if (!tab) { alert('Choose a tab to share.'); return; }
  if (!token) { alert('Enter a GitHub token with Gists read/write permission.'); return; }

  const button = document.getElementById('publish-gist-btn');
  button.disabled = true;
  button.textContent = 'Publishing…';
  try {
    const response = await fetch('https://api.github.com/gists', {
      method: 'POST',
      headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        description: `Martin's Super Webapp tab: ${tab.label}`,
        public: true,
        files: { [`${tab.id}.superwebapp-tab.json`]: { content: JSON.stringify(makeTabDocument(tab), null, 2) } }
      })
    });
    const gist = await response.json();
    if (!response.ok) throw new Error(gist.message || `GitHub returned ${response.status}`);
    const file = gist.files?.[`${tab.id}.superwebapp-tab.json`];
    if (!file?.raw_url) throw new Error('GitHub did not return a raw URL for the Gist.');
    document.getElementById('github-token-input').value = '';
    showShareLink(file.raw_url);
  } catch (error) {
    alert(`Could not publish the tab: ${error.message}`);
  } finally {
    button.disabled = false;
    button.textContent = 'Publish public GitHub Gist';
  }
}

async function importSharedTab() {
  const encodedUrl = new URL(location.href).searchParams.get(SHARE_PARAM);
  if (!encodedUrl) return;
  let publicTabUrl;
  try {
    publicTabUrl = base64UrlDecode(encodedUrl);
    const url = new URL(publicTabUrl);
    if (url.protocol !== 'https:') throw new Error('Only HTTPS tab URLs can be imported.');
    const response = await fetch(url.href, { credentials: 'omit' });
    if (!response.ok) throw new Error(`The tab URL returned ${response.status}.`);
    const document = await response.json();
    if (!validSharedTab(document)) throw new Error('This URL does not contain a supported Super Webapp tab document.');
    const tab = document.tab;
    const exists = getTabs().some(item => item.id === tab.id);
    if (exists && !confirm(`Replace your existing "${tab.label}" tab with the shared version?`)) return;
    if (!exists && !confirm(`Add the shared "${tab.label}" tab to your app?`)) return;
    const tabs = getTabs();
    const index = tabs.findIndex(item => item.id === tab.id);
    const previousTab = index >= 0 ? tabs[index] : null;
    const importedTab = { ...tab, shared: true };
    if (index >= 0) tabs[index] = importedTab; else tabs.push(importedTab);
    await saveTabSnapshot(importedTab, 'Imported shared tab', previousTab, importedTab);
    setTabs(tabs);
    const iframe = tabIframes[tab.id] || document.querySelector(`#pane-${CSS.escape(tab.id)} iframe`);
    if (iframe) {
      iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-modals');
      iframe.srcdoc = tab.html;
    }
    refreshTabsFromStorage();
    activateTab(tab.id);
    addMessage('system', `Imported shared tab "${tab.label}".`);
  } catch (error) {
    alert(`Could not import shared tab: ${error.message}`);
  } finally {
    const cleanUrl = new URL(location.href);
    cleanUrl.searchParams.delete(SHARE_PARAM);
    history.replaceState(null, '', cleanUrl);
  }
}

function openHistoryModal() {
  const history = getHistory();
  const list = document.getElementById('history-list');
  list.innerHTML = '';
  if (!history.length) {
    list.innerHTML = '<p class="history-empty">No history yet. History is saved on every tab change.</p>';
  } else {
    history.forEach((snap, idx) => {
      const item = document.createElement('div');
      item.className = 'history-item';
      const date = new Date(snap.timestamp).toLocaleString();
      const meta = document.createElement('div');
      meta.className = 'h-meta';
      const timestamp = document.createElement('span');
      timestamp.textContent = date;
      const tabId = document.createElement('span');
      tabId.textContent = snap.tab.id;
      meta.append(timestamp, tabId);
      const tabLabel = document.createElement('div');
      tabLabel.className = 'h-tabs';
      tabLabel.textContent = snap.tab.label;
      item.append(meta, tabLabel);
      if (snap.prompt) {
        const prompt = document.createElement('div');
        prompt.className = 'h-prompt';
        prompt.textContent = `Prompt: ${snap.prompt}`;
        item.appendChild(prompt);
      }
      if (snap.previousHash && snap.currentHash) {
        const hashes = document.createElement('div');
        hashes.className = 'h-hash';
        hashes.title = `${snap.hashAlgorithm || 'SHA-256'}\nPrevious: ${snap.previousHash}\nCurrent: ${snap.currentHash}`;
        hashes.textContent = `${snap.hashAlgorithm || 'SHA-256'}: ${snap.previousHash.slice(0, 12)} → ${snap.currentHash.slice(0, 12)}`;
        item.appendChild(hashes);
      }
      const restore = document.createElement('button');
      restore.className = 'btn-small';
      restore.style.cssText = 'margin-top:6px;align-self:flex-start';
      restore.textContent = 'Restore';
      restore.onclick = () => restoreTabSnapshot(idx);
      item.appendChild(restore);
      list.appendChild(item);
    });
  }
  document.getElementById('history-modal').classList.add('open');
}

function closeHistoryModal() {
  document.getElementById('history-modal').classList.remove('open');
}

async function restoreTabSnapshot(idx) {
  const history = getHistory();
  if (!history[idx]) return;
  const restoredTab = history[idx].tab;
  const tabs = getTabs();
  const tabIndex = tabs.findIndex(tab => tab.id === restoredTab.id);
  await saveTabSnapshot(restoredTab, 'Restored from history', tabs[tabIndex], restoredTab);
  if (tabIndex >= 0) tabs[tabIndex] = restoredTab;
  else tabs.push(restoredTab);
  setTabs(tabs);
  const pane = document.getElementById(`pane-${restoredTab.id}`);
  if (pane) pane.remove();
  delete tabIframes[restoredTab.id];
  renderNavTabs();
  activateTab(restoredTab.id);
  closeHistoryModal();
  const date = new Date(history[idx].timestamp).toLocaleString();
  addMessage('system', `Restored "${restoredTab.label}" to its version from ${date}.`);
}

// ============================================================
// 7. UI HELPERS
// ============================================================
function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = content;
  const container = document.getElementById('messages');
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function addExecMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg exec';
  div.textContent = text;
  const container = document.getElementById('messages');
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  messages.push({ role: 'exec', content: text });
  saveMessages();
}

function renderMessages() {
  const container = document.getElementById('messages');
  container.innerHTML = '';
  messages.forEach(m => {
    const div = document.createElement('div');
    div.className = m.role === 'exec' ? 'msg exec' : `msg ${m.role}`;
    div.textContent = m.content;
    container.appendChild(div);
  });
  container.scrollTop = container.scrollHeight;
}

// ============================================================
// 8. INIT & EVENT BINDING
// ============================================================
function init() {
  loadSettings();
  loadMessages();
  refreshTabsFromStorage();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  }

  // Toggle settings on header tap
  document.getElementById('panel-header').onclick = () => {
    const bar = document.getElementById('settings-bar');
    bar.style.display = bar.style.display === 'none' ? '' : 'none';
  };

  // Send / Stop
  document.getElementById('send-btn').onclick = async function() {
    if (isProcessing) {
      cancelRequested = true;
      if (abortController) abortController.abort(); // error path unlocks via finally
      else unlockInput();
      return;
    }
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = '';
    await processUserMessage(text);
  };

  document.getElementById('chat-input').onkeydown = e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('send-btn').click(); }
  };

  // Safety net: never leave the input locked
  setInterval(() => {
    if (!isProcessing) return;
    if (cancelRequested || Date.now() - lastActivity > 300000) unlockInput();
  }, 5000);

  // Auto-resize textarea
  document.getElementById('chat-input').oninput = function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  };

  // Settings auto-save
  ['api-key-input','model-select','api-url-input'].forEach(id => {
    document.getElementById(id).onchange = saveSettings;
  });

  // Config management
  document.getElementById('config-select').onchange = function() {
    if (this.value) { loadConfig(this.value); }
    else {
      document.getElementById('api-key-input').value = localStorage.getItem(API_KEY_KEY) || '';
      document.getElementById('model-select').value  = localStorage.getItem(MODEL_KEY)   || 'gpt-4o';
      const url = localStorage.getItem(API_URL_KEY) || INFERENCE_URLS[0];
      const urlSel = document.getElementById('api-url-input');
      for (const opt of urlSel.options) { if (opt.value === url) { opt.selected = true; break; } }
      document.getElementById('model-badge').textContent = localStorage.getItem(MODEL_KEY) || 'gpt-4o';
      setActiveCfgName('');
    }
  };
  document.getElementById('save-config-btn').onclick = () => {
    const nameInput = document.getElementById('config-name-input');
    const name = nameInput.value.trim() || document.getElementById('model-select').value || 'my-config';
    if (saveCurrentAsConfig(name)) { nameInput.value = ''; addMessage('system', `Config "${name}" saved.`); }
  };
  document.getElementById('delete-config-btn').onclick = () => {
    const name = document.getElementById('config-select').value;
    if (!name) { addMessage('system', 'Select a config to delete.'); return; }
    if (confirm(`Delete config "${name}"?`)) { deleteConfig(name); addMessage('system', `Config "${name}" deleted.`); }
  };
  document.getElementById('config-name-input').onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('save-config-btn').click(); }
  };

  // Clear chat
  document.getElementById('clear-chat-btn').onclick = e => {
    e.stopPropagation();
    messages = []; saveMessages(); renderMessages();
  };

  // History
  document.getElementById('history-btn').onclick = e => { e.stopPropagation(); openHistoryModal(); };

  // Sharing
  document.getElementById('share-btn').onclick = openShareModal;
  document.getElementById('publish-gist-btn').onclick = publishSelectedTabToGist;
  document.getElementById('copy-share-link-btn').onclick = async () => {
    const output = document.getElementById('share-link-output');
    try { await navigator.clipboard.writeText(output.value); }
    catch { output.select(); document.execCommand('copy'); }
  };
  document.getElementById('native-share-btn').onclick = () => navigator.share?.({ title: "Martin's Super Webapp tab", url: document.getElementById('share-link-output').value });

  // Build nav button
  document.getElementById('nav-btn-build').onclick = () => activateTab('build');

  // An installed PWA can resume without DOMContentLoaded after tabs change elsewhere.
  window.addEventListener('pageshow', refreshTabsFromStorage);
  window.addEventListener('focus', refreshTabsFromStorage);
  window.addEventListener('storage', event => {
    if (event.key === TABS_KEY) refreshTabsFromStorage();
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refreshTabsFromStorage();
  });

  importSharedTab();

  // Welcome
  if (messages.length === 0) {
    addMessage('system', "Welcome to Martin's Super Webapp!\n\nUse this Build tab to add tabs to your app. Try:\n• \"Add a todo list tab\"\n• \"Create a Pomodoro timer\"\n• \"Add a notes tab that saves to localStorage\"\n\nSet your API key first (tap the 🔧 Build header).");
  }
}

// The browser may have parsed the whole document before reaching this script
// (cached PWA resume); DOMContentLoaded would then never fire again.
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
